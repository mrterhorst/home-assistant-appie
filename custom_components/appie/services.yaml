add_item:
  target:
    entity:
      integration: appie
      domain: todo
  fields:
    name:
      example: "pindakaas"
      selector:
        text:
    product_id:
      example: 441199
      selector:
        number:
          min: 1
          max: 999999999
          mode: box
    quantity:
      default: 1
      selector:
        number:
          min: 1
          max: 99
          mode: box
    link_product:
      default: false
      selector:
        boolean:

search_products:
  target:
    entity:
      integration: appie
      domain: todo
  fields:
    query:
      required: true
      example: "pindakaas"
      selector:
        text:
    limit:
      default: 5
      selector:
        number:
          min: 1
          max: 25
          mode: box

checkout:
  target:
    entity:
      integration: appie
      domain: todo

clear_list:
  target:
    entity:
      integration: appie
      domain: todo
